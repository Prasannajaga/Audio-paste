<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Paste</title>
</head>

<body>
  <div id="app">

    <div id="wave-area">
      <div id="wave" class="wave">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <p id="status-text">Tap to listen</p>
      <div id="status-progress" class="status-progress hidden" aria-hidden="true">
        <div class="status-progress-bar"></div>
      </div>
    </div>

    <div id="transcript-wrap" class="transcript-wrap">
      <div class="transcript-card">
        <div class="transcript-head">
          <span class="transcript-label">Transcription</span>
          <button id="copy-transcript-btn" class="copy-btn" type="button" aria-label="Copy transcription text">
            <span class="copy-btn-icon" aria-hidden="true">⧉</span>
          </button>
        </div>
        <div id="transcript" class="transcript"></div>
      </div>
    </div>

    <div class="bottom-bar">
      <span id="hotkey" class="hotkey">Ctrl+Alt+R</span>
      <button id="settings-btn" class="settings-btn">Settings</button>
    </div>

  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-head">
        <span class="modal-title">Settings</span>
        <button id="modal-close" class="modal-x">&times;</button>
      </div>

      <div class="modal-section">
        <span class="section-label">Model</span>
        <div id="model-chips" class="chip-group">
          <button class="chip" data-value="tiny">Tiny</button>
          <button class="chip active" data-value="base">Base</button>
        </div>
      </div>

      <div class="modal-section">
        <div class="thread-row">
          <span class="section-label">CPU Threads</span>
          <div class="stepper">
            <button id="thread-dec" class="step-btn">&minus;</button>
            <span id="thread-val" class="step-val">4</span>
            <button id="thread-inc" class="step-btn">+</button>
          </div>
        </div>
      </div>

      <div class="modal-section">
        <span class="section-label">Audio Tuning</span>
        <div class="tuning-grid">
          <label class="setting-card">
            <div class="setting-top">
              <span class="setting-name">Silence Threshold</span>
              <span class="setting-chip">Noise gate</span>
            </div>
            <input id="silence-threshold" class="setting-input" type="number" min="0.001" max="1" step="0.001" value="0.01" />
            <small class="setting-help">Lower values make the detector more sensitive to quiet speech. Raise it if background noise is triggering false starts.</small>
          </label>

          <label class="setting-card">
            <div class="setting-top">
              <span class="setting-name">Silence Seconds</span>
              <span class="setting-chip">Pause window</span>
            </div>
            <input id="silence-seconds" class="setting-input" type="number" min="1" max="10" step="1" value="2" />
            <small class="setting-help">Higher values let you pause briefly and keep talking without the recording ending too early.</small>
          </label>
        </div>
      </div>

      <button id="apply-btn" class="modal-apply">Apply</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
