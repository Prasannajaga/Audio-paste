name: Build Cross Platform Tauri App

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libxdo-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            cmake

      - name: Ensure whisper.cpp source
        shell: bash
        run: |
          if [ -f src-tauri/whisper.cpp/CMakeLists.txt ]; then
            echo "Using checked-in src-tauri/whisper.cpp"
          else
            rm -rf src-tauri/whisper.cpp
            git clone --depth 1 --branch v1.8.4 https://github.com/ggerganov/whisper.cpp src-tauri/whisper.cpp
          fi

      - name: Install npm dependencies
        run: npm ci

      - name: Build whisper.cpp
        shell: bash
        run: |
          cmake -S src-tauri/whisper.cpp -B src-tauri/whisper.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build src-tauri/whisper.cpp/build --config Release --parallel

      - name: Normalize whisper runtime assets
        shell: bash
        run: |
          mkdir -p src-tauri/whisper.cpp/build/bin

          normalize_asset() {
            local source_name="$1"
            local target_path="$2"
            local source_path

            source_path="$(find src-tauri/whisper.cpp/build -type f -name "$source_name" | head -n 1)"
            if [ -z "$source_path" ]; then
              echo "Could not find required asset: $source_name"
              find src-tauri/whisper.cpp/build -maxdepth 5 -type f | sed -n '1,200p'
              exit 1
            fi

            local source_real
            local target_real
            source_real="$(cd "$(dirname "$source_path")" && pwd)/$(basename "$source_path")"
            target_real="$(cd "$(dirname "$target_path")" && pwd)/$(basename "$target_path")"

            if [ "$source_real" != "$target_real" ]; then
              cp -f "$source_path" "$target_path"
            else
              echo "Asset already normalized at $target_path"
            fi
          }

          if [ "${RUNNER_OS}" = "Windows" ]; then
            normalize_asset "whisper-cli.exe" "src-tauri/whisper.cpp/build/bin/whisper-cli.exe"
            for dll in whisper.dll ggml.dll ggml-base.dll ggml-cpu.dll; do
              normalize_asset "$dll" "src-tauri/whisper.cpp/build/bin/$dll"
            done
          else
            normalize_asset "whisper-cli" "src-tauri/whisper.cpp/build/bin/whisper-cli"
            chmod +x src-tauri/whisper.cpp/build/bin/whisper-cli || true
          fi

      - name: Build Tauri app
        shell: bash
        run: PREPARE_TAURI_TARGET_OS="${RUNNER_OS}" npm run tauri:build

      - name: Upload bundles
        uses: actions/upload-artifact@v6
        with:
          name: tauri-bundle-${{ runner.os }}
          path: src-tauri/target/release/bundle
          if-no-files-found: error
