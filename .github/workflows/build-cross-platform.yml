name: Build Cross Platform Tauri App

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            cmake

      - name: Ensure whisper.cpp source
        shell: bash
        run: |
          if [ -d src-tauri/whisper.cpp ]; then
            echo "Using checked-in src-tauri/whisper.cpp"
          else
            git clone --depth 1 --branch v1.8.4 https://github.com/ggerganov/whisper.cpp src-tauri/whisper.cpp
          fi

      - name: Install npm dependencies
        run: npm ci

      - name: Build whisper.cpp
        run: |
          cmake -S src-tauri/whisper.cpp -B src-tauri/whisper.cpp/build -DCMAKE_BUILD_TYPE=Release
          cmake --build src-tauri/whisper.cpp/build --config Release --parallel

      - name: Normalize whisper-cli path
        shell: bash
        run: |
          mkdir -p src-tauri/whisper.cpp/build/bin
          BIN_PATH="$(find src-tauri/whisper.cpp/build -type f \( -name 'whisper-cli' -o -name 'whisper-cli.exe' \) | head -n 1)"
          if [ -z "$BIN_PATH" ]; then
            echo "Could not find whisper-cli binary"
            exit 1
          fi
          cp "$BIN_PATH" src-tauri/whisper.cpp/build/bin/whisper-cli
          chmod +x src-tauri/whisper.cpp/build/bin/whisper-cli || true

      - name: Prepare OS-specific Tauri config
        run: |
          node -e "const fs=require('fs'); const p='src-tauri/tauri.conf.json'; const os=process.env.RUNNER_OS; const c=JSON.parse(fs.readFileSync(p,'utf8')); c.bundle ??= {}; const base=['whisper.cpp/build/bin/whisper-cli']; if(os==='Linux'){ c.bundle.targets=['appimage','deb','rpm']; c.bundle.resources=[...base,'whisper.cpp/build/src/libwhisper.so.1','whisper.cpp/build/ggml/src/libggml.so.0','whisper.cpp/build/ggml/src/libggml-base.so.0','whisper.cpp/build/ggml/src/libggml-cpu.so.0']; } else if (os==='Windows'){ c.bundle.targets=['nsis','msi']; c.bundle.resources=base; } else { c.bundle.targets=['app','dmg']; c.bundle.resources=base; } fs.writeFileSync(p, JSON.stringify(c,null,2));"

      - name: Build Tauri app
        run: npx tauri build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundle-${{ runner.os }}
          path: src-tauri/target/release/bundle
          if-no-files-found: error
